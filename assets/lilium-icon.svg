<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgVelvet" cx="46%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2a2136" />
      <stop offset="60%" stop-color="#181222" />
      <stop offset="100%" stop-color="#0f0b16" />
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.46" />
      <stop offset="48%" stop-color="#eab875" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#eab875" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6dfae" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#c99c52" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#f2d69b" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="outerPetal" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#d5cdb8" />
      <stop offset="32%" stop-color="#f3eee6" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffdf9" />
    </linearGradient>
    <linearGradient id="innerPetal" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e5e0cb" />
      <stop offset="36%" stop-color="#faf7f2" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="throatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eef2b8" />
      <stop offset="65%" stop-color="#dce49c" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="antherGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e5a20" />
      <stop offset="50%" stop-color="#ebb44c" />
      <stop offset="100%" stop-color="#8b4d1b" />
    </linearGradient>
    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#09060e" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Cameo Base & Hairline Conservatory Frame -->
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#bgVelvet)" />
  <rect x="4.5" y="4.5" width="119" height="119" rx="28.5" fill="none" stroke="url(#goldFrame)" stroke-width="2" />
  <circle cx="64" cy="64" r="46" fill="none" stroke="#f0d39a" stroke-opacity="0.16" stroke-width="0.9" />
  <circle cx="64" cy="64" r="46" fill="url(#aura)" />

  <!-- Subtle Starlight Motes -->
  <circle cx="28" cy="30" r="1.4" fill="#f7e3b6" opacity="0.78" />
  <circle cx="101" cy="34" r="1.1" fill="#ffffff" opacity="0.65" />
  <circle cx="96" cy="98" r="1.5" fill="#f5d999" opacity="0.72" />
  <circle cx="31" cy="96" r="1.1" fill="#ffffff" opacity="0.55" />

  <!-- White Lilium Candidum Emblem -->
  <g transform="translate(64 64) rotate(-6)" filter="url(#softDrop)">
    <!-- Outer Sepals (0, 120, 240 deg) -->
    <g transform="rotate(0)">
      <path d="M0 2 C-10 -12 -14 -30 0 -47 C14 -30 10 -12 0 2 Z" fill="url(#outerPetal)" stroke="#cfc4b6" stroke-width="0.75" />
      <path d="M0 -3 L0 -41" stroke="#dbd2c2" stroke-width="0.9" opacity="0.6" />
    </g>
    <g transform="rotate(120)">
      <path d="M0 2 C-10 -12 -14 -30 0 -47 C14 -30 10 -12 0 2 Z" fill="url(#outerPetal)" stroke="#cfc4b6" stroke-width="0.75" />
      <path d="M0 -3 L0 -41" stroke="#dbd2c2" stroke-width="0.9" opacity="0.6" />
    </g>
    <g transform="rotate(240)">
      <path d="M0 2 C-10 -12 -14 -30 0 -47 C14 -30 10 -12 0 2 Z" fill="url(#outerPetal)" stroke="#cfc4b6" stroke-width="0.75" />
      <path d="M0 -3 L0 -41" stroke="#dbd2c2" stroke-width="0.9" opacity="0.6" />
    </g>

    <!-- Inner Petals (60, 180, 300 deg) -->
    <g transform="rotate(60)">
      <path d="M0 3 C-12 -11 -16 -28 0 -44 C16 -28 12 -11 0 3 Z" fill="url(#innerPetal)" stroke="#ded5c8" stroke-width="0.75" />
      <path d="M0 -4 L0 -38" stroke="#e4decb" stroke-width="0.85" opacity="0.55" />
    </g>
    <g transform="rotate(180)">
      <path d="M0 3 C-12 -11 -16 -28 0 -44 C16 -28 12 -11 0 3 Z" fill="url(#innerPetal)" stroke="#ded5c8" stroke-width="0.75" />
      <path d="M0 -4 L0 -38" stroke="#e4decb" stroke-width="0.85" opacity="0.55" />
    </g>
    <g transform="rotate(300)">
      <path d="M0 3 C-12 -11 -16 -28 0 -44 C16 -28 12 -11 0 3 Z" fill="url(#innerPetal)" stroke="#ded5c8" stroke-width="0.75" />
      <path d="M0 -4 L0 -38" stroke="#e4decb" stroke-width="0.85" opacity="0.55" />
    </g>

    <!-- Luminous Botanical Throat -->
    <circle cx="0" cy="0" r="12" fill="url(#throatGlow)" />

    <!-- Filaments & Golden Anthers -->
    <g transform="rotate(-14)">
      <path d="M0 0 Q-3 -9 -2 -18" stroke="#dfdaae" stroke-width="1.25" fill="none" stroke-linecap="round" />
      <ellipse cx="-2" cy="-20" rx="4.2" ry="1.8" transform="rotate(-22 -2 -20)" fill="url(#antherGold)" />
    </g>
    <g transform="rotate(42)">
      <path d="M0 0 Q3 -9 2 -18" stroke="#dfdaae" stroke-width="1.25" fill="none" stroke-linecap="round" />
      <ellipse cx="2" cy="-20" rx="4.2" ry="1.8" transform="rotate(18 2 -20)" fill="url(#antherGold)" />
    </g>
    <g transform="rotate(106)">
      <path d="M0 0 Q2 -8 1 -16" stroke="#dfdaae" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <ellipse cx="1" cy="-18" rx="4.0" ry="1.7" transform="rotate(-14 1 -18)" fill="url(#antherGold)" />
    </g>
    <g transform="rotate(168)">
      <path d="M0 0 Q-2 -9 -1 -17" stroke="#dfdaae" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <ellipse cx="-1" cy="-19" rx="4.1" ry="1.7" transform="rotate(20 -1 -19)" fill="url(#antherGold)" />
    </g>
    <g transform="rotate(232)">
      <path d="M0 0 Q2 -8 2 -17" stroke="#dfdaae" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <ellipse cx="2" cy="-19" rx="4.0" ry="1.7" transform="rotate(-16 2 -19)" fill="url(#antherGold)" />
    </g>
    <g transform="rotate(294)">
      <path d="M0 0 Q-3 -9 -2 -18" stroke="#dfdaae" stroke-width="1.25" fill="none" stroke-linecap="round" />
      <ellipse cx="-2" cy="-20" rx="4.2" ry="1.8" transform="rotate(18 -2 -20)" fill="url(#antherGold)" />
    </g>

    <!-- Central Pearl Stigma -->
    <circle cx="0" cy="0" r="3.4" fill="#f7f8da" stroke="#b9bd83" stroke-width="0.9" />
  </g>
</svg>
